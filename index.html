<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Telefon Simülasyonu</title>
<style>
  body {margin:0; background:#111; display:flex; justify-content:center;}
  .phone {width:360px; height:640px; background:#eee; border-radius:30px; overflow:hidden; position:relative; font-family:Arial;}
  .statusbar {background:#000; color:#fff; padding:5px; text-align:center; font-size:14px;}
  .desktop {display:flex; flex-wrap:wrap; justify-content:center; padding:20px;}
  .icon {width:80px; text-align:center; margin:10px; cursor:pointer; background:#ddd; border-radius:10px; padding:10px;}
  .nav {position:absolute; bottom:0; width:100%; height:50px; background:#222; display:flex; justify-content:space-around; align-items:center; color:white; font-size:24px;}
  .window {position:absolute; top:40px; left:0; right:0; bottom:50px; background:#fff; overflow:auto; padding:10px;}
  .battery {width:200px; height:40px; border:2px solid #000; margin:auto; position:relative;}
  .battery::after {content:""; position:absolute; right:-10px; top:10px; width:10px; height:20px; background:#000;}
  .fill {height:100%; width:0%; background:lime; transition:width 3s;}
  .card {border:1px solid #ccc; padding:8px; margin-top:8px; border-radius:6px;}
  .card button {margin-top:5px;}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar" id="statusbar">🔋100% 📶4G | 09:30</div>
  <div class="desktop">
    <div class="icon" onclick="openApp('google')">🌐<br>Google</div>
    <div class="icon" onclick="openApp('facebook')">📘<br>Facebook</div>
    <div class="icon" onclick="openApp('instagram')">📸<br>Instagram</div>
    <div class="icon" onclick="openApp('tiktok')">🎵<br>TikTok</div>
    <div class="icon" onclick="openApp('duolingo')">🦉<br>Duolingo</div>
    <div class="icon" onclick="openApp('copilot')">🤖<br>Copilot</div>
    <div class="icon" onclick="openApp('camera')">📷<br>Kamera</div>
    <div class="icon" onclick="openApp('nocommand')">.<br>açılmayan uygulama</div>
    <div class="icon" onclick="openApp('charge')">🔌<br>Şarj</div>
  </div>
  <div class="nav">
    <div onclick="goBack()">◁</div>
    <div onclick="showApps()">☐</div>
    <div onclick="goHome()">⭘</div>
  </div>
</div>

<script>
let historyStack=[];
let camStream=null;
let batteryLevel=100;
let searchHistory=[]; // Google arama geçmişi
const NOKIA_SRC="https://www.youtube.com/embed/2Z4m4lnjxkY";

// ------------------ UYGULAMA AÇMA ------------------
function openApp(app){
  let win=document.createElement("div");
  win.className="window";

  if(app==="google"){
    win.innerHTML=`
      <h2>Google</h2>
      <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" width="200"><br><br>
      <input id="gAra" placeholder="Google'da ara" style="width:90%; padding:8px;">
      <button onclick="googleAra()">Ara</button>
      <h3>Son aramalar</h3>
      <ul id="gGecmis"></ul>
      <h3>Sonuçlar</h3>
      <div id="gSonuc"></div>
    `;
    setTimeout(guncelleGecmis,50);
  }

  if(app==="facebook"){
    win.innerHTML=`
      <div style="background:#3b5998;color:white;padding:8px;">Facebook</div>
      <h3>Akış</h3>
      <div class="card">
        <b>Nokia Meme Videosu</b>
        <p>Arkadaşın bir video paylaştı.</p>
        <iframe width="100%" height="200" src="${NOKIA_SRC}" allowfullscreen></iframe>
      </div>
      <div class="card">
        <b>Sahte Gönderi</b>
        <p>Bugün hava çok güzel!</p>
      </div>
    `;
  }

  if(app==="nocommand"){
    win.innerHTML=
     <div style="background:#3b5998;color:white;padding:8px;">nocommand</div>
      <h3>nevar?</h3>
       <div class="card">
        <b>LAN NE VAR</b>
      <div class="card">
        <b>açma bu uygulamayı plzs😑</b>
        <p>açmaaaaaaaaaa</p>
      </div>
    `;
  }
    if(app==="instagram"){
    win.innerHTML=`
      <div style="background:#000;color:white;padding:8px;">Instagram</div>
      <p>Hikayeler</p>
      <div style="display:flex;gap:8px;">
        <div style="width:50px;height:50px;border-radius:50%;background:#f90;"></div>
        <div style="width:50px;height:50px;border-radius:50%;background:#09f;"></div>
      </div>
      <h3>Gönderi</h3>
      <div class="card">
        <b>Nokia Meme Reels</b>
        <iframe width="100%" height="200" src="${NOKIA_SRC}" allowfullscreen></iframe>
        <p>😂 99999M izlenme</p>
      </div>
    `;
  }

  if(app==="tiktok"){
    win.innerHTML=`
      <div style="background:#000;color:#0ff;padding:8px;">TikTok</div>
      <h3>For You</h3>
      <iframe width="100%" height="250" src="${NOKIA_SRC}" allowfullscreen></iframe>
      <p>💬 Yorumlar</p>
      <ul>
        <li>Bu telefon asla kırılmaz phphphphpggpgpa😂</li>
        <li>Çocukluğumun sesi...(severizzz)</li>
        <li>1M kez dinledim hâlâ sıkılmadım AEĞEĞĞEĞEĞEĞE.</li>
      </ul>
    `;
  }

  if(app==="duolingo"){
    win.innerHTML=`
      <div style="background:#58cc02;color:white;padding:8px;">Duolingo</div>
      <h3>Dersler</h3>
      <ul>
        <li>Temel 1</li>
        <li>Temel 2</li>
        <li>İfadeler</li>
      </ul>
      <h3>Ders Videosu</h3>
      <iframe width="100%" height="200" src="${NOKIA_SRC}" allowfullscreen></iframe>
      <p>🦉 Baykuş: Dersi bitirmeyi unutma!</p>
    `;
  }

  if(app==="copilot"){
    win.innerHTML=`
      <h2>Copilot 🤖</h2>
      <p>Adını yaz:</p>
      <input id="ad" placeholder="Adın">
      <button onclick="selamVer()">Gönder</button>
      <div id="selam"></div>
    `;
  }

  if(app==="camera"){
    win.innerHTML=`
      <h2>Kamera</h2>
      <button onclick='startCam("user")'>Ön Kamera</button>
      <button onclick='startCam("environment")'>Arka Kamera</button><br>
      <video id="cam" autoplay playsinline width="100%" height="90%"></video>
    `;
  }

  if(app==="charge"){
    win.innerHTML=`
      <h2>Şarja Takıldı ⚡</h2>
      <div class="battery"><div class="fill" id="fill"></div></div>
      <p id="chargeText">Şarj oluyor...</p>
    `;
    setTimeout(()=>{
      document.getElementById("fill").style.width="100%";
      document.getElementById("chargeText").innerText="Şarj doldu ✅";
      batteryLevel=100;
      updateStatusBar(true);
    },3000);
  }

  document.querySelector(".phone").appendChild(win);
  historyStack.push(win);
}

// ------------------ GOOGLE ARAMA ------------------
function googleAra(){
  let q=document.getElementById("gAra").value.trim().toLowerCase();
  if(!q) return;
  searchHistory.unshift(q);
  if(searchHistory.length>10) searchHistory.pop();
  guncelleGecmis();

  let html="";
  if(q.includes("facebook")){
    html+=`
      <div class="card">
        <b>Facebook</b>
        <p>Sosyal ağ – arkadaşlarınla bağlantı kur.</p>
        <button onclick="openApp('facebook')">Aç</button>
      </div>`;
  }
  if(q.includes("instagram")){
    html+=`
      <div class="card">
        <b>Instagram</b>
        <p>Fotoğraf ve video paylaş.</p>
        <button onclick="openApp('instagram')">Aç</button>
      </div>`;
  }
  if(q.includes("tiktok")){
    html+=`
      <div class="card">
        <b>TikTok</b>
        <p>Kısa videolar – Nokia meme trendde!</p>
        <button onclick="openApp('tiktok')">Aç</button>
      </div>`;
  }
  if(q.includes("duolingo")){
    html+=`
      <div class="card">
        <b>Duolingo</b>
        <p>Dil öğren – eğlenceli dersler.</p>
        <button onclick="openApp('duolingo')">Aç</button>
      </div>`;
  }
  if(q.includes("nokia") || q.includes("meme")){
    html+=`
      <div class="card">
        <b>Nokia Meme Videosu</b>
        <p>Tek video – klasik zil sesi memeleri.</p>
        <iframe width="100%" height="200" src="${NOKIA_SRC}" allowfullscreen></iframe>
      </div>`;
  }
  if(q.includes("roblox")){
    html+=`
      <div class="card">
        <b>Roblox</b>
        <p>Oyun platformu – obby, tycoon, simulator.</p>
      </div>`;
  }
  if(!html){
    html="<p>Bu arama için özel sonuç yok. Yine de geçmişe kaydedildi.</p>";
  }
  document.getElementById("gSonuc").innerHTML=html;
}

function guncelleGecmis(){
  let ul=document.getElementById("gGecmis");
  if(!ul) return;
  ul.innerHTML="";
  searchHistory.forEach(item=>{
    let li=document.createElement("li");
    li.textContent=item;
    ul.appendChild(li);
  });
}

// ------------------ COPILOT SELAM ------------------
function selamVer(){
  let ad=document.getElementById("ad").value.trim();
  if(!ad) return;
  document.getElementById("selam").innerText="Merhaba "+ad+" 👋";
}

// ------------------ KAMERA ------------------
function startCam(facing){
  navigator.mediaDevices.getUserMedia({video:{facingMode:facing}})
  .then(stream=>{
    camStream=stream;
    document.getElementById("cam").srcObject=stream;
  })
  .catch(err=>alert("Kamera hatası: "+err));
}

// ------------------ GERİ / ANA ------------------
function goBack(){
  if(historyStack.length){
    let w=historyStack.pop();
    if(w.querySelector("#cam") && camStream){
      camStream.getTracks().forEach(t=>t.stop());
      camStream=null;
    }
    w.remove();
  }
}
function goHome(){
  historyStack.forEach(w=>{
    if(w.querySelector("#cam") && camStream){
      camStream.getTracks().forEach(t=>t.stop());
      camStream=null;
    }
    w.remove();
  });
  historyStack=[];
}
function showApps(){alert("Açık uygulamalar: "+historyStack.length);}

// ------------------ PİL ------------------
function updateStatusBar(forceFull=false){
  let now=new Date();
  let h=String(now.getHours()).padStart(2,"0");
  let m=String(now.getMinutes()).padStart(2,"0");
  if(!forceFull){
    batteryLevel--;
    if(batteryLevel<0) batteryLevel=0;
  }
  document.getElementById("statusbar").innerText=
    "🔋"+batteryLevel+"% 📶4G | "+h+":"+m;
}
setInterval(updateStatusBar,10000);
updateStatusBar();
</script>
</body>
</html>
