<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Telefon Simülasyonu</title>
<style>
  body {margin:0; background:#111; display:flex; justify-content:center;}
  .phone {width:360px; height:640px; background:#eee; border-radius:30px; overflow:hidden; position:relative; font-family:Arial;}
  .statusbar {background:#000; color:#fff; padding:5px; text-align:center; font-size:14px;}
  .desktop {display:flex; flex-wrap:wrap; justify-content:center; padding:20px;}
  .icon {width:80px; text-align:center; margin:10px; cursor:pointer; background:#ddd; border-radius:10px; padding:10px;}
  .nav {position:absolute; bottom:0; width:100%; height:50px; background:#222; display:flex; justify-content:space-around; align-items:center; color:white; font-size:24px;}
  .window {position:absolute; top:40px; left:0; right:0; bottom:50px; background:#fff; overflow:auto; padding:10px;}
  canvas {background:#ccc; display:block; margin:auto;}
  .controls {text-align:center; margin-top:10px;}
  .controls button {margin:5px; padding:10px;}
  .charge {text-align:center; margin-top:50px; font-size:24px;}
  .battery {width:200px; height:40px; border:2px solid #000; margin:auto; position:relative;}
  .battery::after {content:""; position:absolute; right:-10px; top:10px; width:10px; height:20px; background:#000;}
  .fill {height:100%; width:0%; background:lime; transition:width 3s;}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar" id="statusbar">🔋100% 📶4G | 09:13</div>
  <div class="desktop">
    <div class="icon" onclick="openApp('google')">🌐<br>Google</div>
    <div class="icon" onclick="openApp('youtube')">📺<br>YouTube</div>
    <div class="icon" onclick="openApp('game')">🚗<br>Oyun</div>
    <div class="icon" onclick="openApp('dialer')">📞<br>Arama</div>
    <div class="icon" onclick="openApp('camera')">📷<br>Kamera</div>
    <div class="icon" onclick="openApp('snapchat')">👻<br>Snapchat</div>
    <div class="icon" onclick="openApp('copilot')">🤖<br>Copilot</div>
    <div class="icon" onclick="openApp('charge')">🔌<br>Şarj</div>
  </div>
  <div class="nav">
    <div onclick="goBack()">◁</div>
    <div onclick="showApps()">☐</div>
    <div onclick="goHome()">⭘</div>
  </div>
</div>

<script>
let historyStack=[];
let camStream=null;
let batteryLevel=100;

function openApp(app){
  let win=document.createElement("div");
  win.className="window";
  if(app==="copilot") {
    win.innerHTML="<h2>Copilot 🤖</h2><p>Adını yaz:</p><input id='ad' placeholder='Adınız'><button onclick='selamVer()'>Gönder</button><div id='selam'></div>";
  }
  if(app==="google") win.innerHTML="<h2>Google</h2><input id='search' placeholder='Ara'><button onclick='searchApp()'>Ara</button><div id='searchResult'></div>";
  if(app==="youtube") win.innerHTML="<h2>YouTube - Nokia Memeleri</h2><iframe width='100%' height='200' src='https://www.youtube.com/embed/2Z4m4lnjxkY' allowfullscreen></iframe>";
  if(app==="game") {win.innerHTML="<h2>Araba Oyunu</h2><canvas id='car' width='300' height='200'></canvas><div class='controls'><button onclick='move(-10,0)'>◁</button><button onclick='move(10,0)'>▷</button><br><button onclick='move(0,-10)'>↑</button><button onclick='move(0,10)'>↓</button></div>"; setTimeout(initGame,100);}
  if(app==="dialer") win.innerHTML="<h2>Arama</h2><input id='numara' placeholder='Numara'><button onclick='alert(\"Aranıyor: \"+document.getElementById(\"numara\").value)'>Ara</button>";
  if(app==="camera") win.innerHTML="<h2>Kamera</h2><button onclick='startCam(\"user\")'>Ön Kamera</button><button onclick='startCam(\"environment\")'>Arka Kamera</button><br><video id='cam' autoplay playsinline width='100%' height='90%'></video>";
  if(app==="snapchat") win.innerHTML="<h2>Snapchat 👻</h2><p>Fotoğraf çekmek için kamera açılır (simülasyon).</p>";
  if(app==="charge") {win.innerHTML="<div class='charge'><h2>Şarja Takıldı ⚡</h2><div class='battery'><div class='fill' id='fill'></div></div><p id='chargeText'>Şarj oluyor...</p></div>"; setTimeout(()=>{document.getElementById("fill").style.width="100%"; document.getElementById("chargeText").innerText="Şarj doldu ✅"; batteryLevel=100; updateStatusBar(true);},3000);}
  document.querySelector(".phone").appendChild(win);
  historyStack.push(win);
}

function selamVer(){
  let ad=document.getElementById("ad").value;
  document.getElementById("selam").innerText="Merhaba "+ad+" 👋";
}

function goBack(){if(historyStack.length){let w=historyStack.pop(); if(w.querySelector("#cam")&&camStream){camStream.getTracks().forEach(t=>t.stop()); camStream=null;} w.remove();}}
function goHome(){historyStack.forEach(w=>{if(w.querySelector("#cam")&&camStream){camStream.getTracks().forEach(t=>t.stop()); camStream=null;} w.remove();}); historyStack=[];}
function showApps(){alert("Açık uygulamalar: "+historyStack.length);}

function searchApp(){let val=document.getElementById("search").value.toLowerCase(); let result=document.getElementById("searchResult"); if(val==="roblox"){result.innerHTML="<h3>Roblox Oyunları</h3><ul><li>Obby Parkur</li><li>Tycoon İşletme</li><li>Simulator Koşu</li><li>Roleplay Şehir</li></ul>";} else {result.innerHTML="<p>Sonuç bulunamadı.</p>";}}

let ctx, carX=140, carY=90;
function initGame(){let canvas=document.getElementById("car"); if(!canvas) return; ctx=canvas.getContext("2d"); drawCar();}
function drawCar(){ctx.clearRect(0,0,300,200); ctx.fillStyle="red"; ctx.fillRect(carX,carY,20,20);}
function move(dx,dy){carX+=dx; carY+=dy; if(carX<0) carX=0; if(carY<0) carY=0; if(carX>280) carX=280; if(carY>180) carY=180; drawCar();}

function startCam(facing){navigator.mediaDevices.getUserMedia({video:{facingMode:facing}}).then(stream=>{camStream=stream; document.getElementById('cam').srcObject=stream;}).catch(err=>alert("Kamera hatası: "+err));}

function updateStatusBar(forceFull=false){
  let now=new Date();
  let h=String(now.getHours()).padStart(2,"0");
  let m=String(now.getMinutes()).padStart(2,"0");
  if(!forceFull){batteryLevel--; if(batteryLevel<0) batteryLevel=0;}
  let signal=["📶2G","📶3G","📶4G","📶5G"][Math.floor(Math.random()*4)];
  document.getElementById("statusbar").innerText="🔋"+batteryLevel+"% "+signal+" | "+h+":"+m;
}
setInterval(updateStatusBar,10000);
updateStatusBar();
</script>
</body>
</html>
